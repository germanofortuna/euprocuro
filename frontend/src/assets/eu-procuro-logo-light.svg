<svg width="520" height="128" viewBox="0 0 520 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epLogoLightTitle epLogoLightDesc">
  <title id="epLogoLightTitle">Eu Procuro</title>
  <desc id="epLogoLightDesc">Eu Procuro - Marketplace Reverso. Lente convergente com pontos orbitais representando vendedores que chegam ao comprador.</desc>
  <defs>
    <linearGradient id="epLensGradLight" x1="32" y1="20" x2="128" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40D8"/>
      <stop offset="0.55" stop-color="#3157F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="epLensFillLight" cx="78" cy="50" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#E8EDFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E8EDFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="epEuGradLight" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40D8"/>
      <stop offset="1" stop-color="#3157F6"/>
    </linearGradient>
  </defs>

  <!-- Magnifying lens -->
  <g>
    <!-- Handle -->
    <path d="M28 110 L52 86" stroke="url(#epLensGradLight)" stroke-width="11" stroke-linecap="round"/>
    <!-- Lens body -->
    <circle cx="78" cy="60" r="36" fill="url(#epLensFillLight)" stroke="url(#epLensGradLight)" stroke-width="6"/>
    <!-- Inner concentric ring (target) -->
    <circle cx="78" cy="60" r="18" stroke="#3157F6" stroke-width="2.2" fill="none" opacity="0.55"/>
    <!-- Central jewel: sparkle made of two crossing diamonds -->
    <path d="M78 50 L82.5 60 L78 70 L73.5 60 Z" fill="#1E40D8"/>
    <path d="M68 60 L78 56 L88 60 L78 64 Z" fill="#22D3EE"/>
    <circle cx="78" cy="60" r="2.4" fill="#FFFFFF"/>
    <!-- Convergent orbital dots (sellers reaching buyer) -->
    <circle cx="44" cy="30" r="5" fill="#22D3EE"/>
    <circle cx="118" cy="42" r="6" fill="#7C3AED"/>
    <circle cx="108" cy="100" r="5" fill="#F472B6"/>
    <!-- Subtle inward motion lines -->
    <path d="M50 34 L60 42" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M112 46 L100 52" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M104 95 L94 86" stroke="#F472B6" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <text x="140" y="68" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#epEuGradLight)" letter-spacing="-1.5">eu</text>
  <text x="196" y="68" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="500" fill="#0F1830" letter-spacing="-0.8">procuro</text>
  <text x="140" y="100" font-family="Sora, Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#1E40D8" letter-spacing="3.2">MARKETPLACE REVERSO</text>
</svg>
