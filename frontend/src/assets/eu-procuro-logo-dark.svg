<svg width="420" height="108" viewBox="54 0 366 108" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eu Procuro</title>
  <desc id="desc">Logo Eu Procuro com lupa transparente sobre o texto EU.</desc>
  <defs>
    <linearGradient id="lensStroke" x1="78" y1="18" x2="151" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D3FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="handleStroke" x1="66" y1="88" x2="97" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D3FF"/>
      <stop offset="1" stop-color="#0B4FBB"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(114 49) rotate(52) scale(38)">
      <stop stop-color="#F8FBFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#9FC3F2" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="logoShadow" x="40" y="3" width="155" height="105" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g>
    <text x="92" y="57" font-family="Sora, Arial, sans-serif" font-size="35" font-weight="900" fill="#35D3FF" letter-spacing="0.5">EU</text>
    <text x="151" y="57" font-family="Sora, Arial, sans-serif" font-size="35" font-weight="300" fill="#EDF6FF" letter-spacing="0.5">PROCURO</text>
    <text x="153" y="83" font-family="Sora, Arial, sans-serif" font-size="13" font-weight="800" fill="#5B8CFF" letter-spacing="3">MARKETPLACE REVERSO</text>
  </g>

  <g filter="url(#logoShadow)">
    <path d="M68 86L91 68" stroke="url(#handleStroke)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="113" cy="50" r="30" fill="url(#lensFill)"/>
    <circle cx="113" cy="50" r="30" stroke="url(#lensStroke)" stroke-width="6"/>
    <circle cx="113" cy="50" r="22" stroke="#E7F2FF" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M101 39c5-5 15-6 22-1" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="59" font-family="Sora, Arial, sans-serif" font-size="25" font-weight="900" fill="#EAF6FF" letter-spacing="-0.8">EU</text>
  </g>
</svg>
