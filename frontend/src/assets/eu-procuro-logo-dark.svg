<svg width="420" height="108" viewBox="0 0 420 108" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eu Procuro</title>
  <desc id="desc">Logo Eu Procuro com uma lupa sobre um anuncio em jornal.</desc>
  <defs>
    <linearGradient id="lensStroke" x1="34" y1="16" x2="124" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D3FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="handleStroke" x1="20" y1="94" x2="58" y2="60" gradientUnits="userSpaceOnUse">
