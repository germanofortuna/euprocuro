      <stop offset="1" stop-color="#0B4FBB"/>
    </linearGradient>
    <radialGradient id="lensFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(73 50) rotate(52) scale(58)">
