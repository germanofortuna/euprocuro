<svg width="520" height="128" viewBox="0 0 520 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epLogoDarkTitle epLogoDarkDesc">
  <title id="epLogoDarkTitle">Eu Procuro</title>
  <desc id="epLogoDarkDesc">Eu Procuro - Marketplace Reverso. Versao para tema escuro.</desc>
  <defs>
    <linearGradient id="epLensGradDark" x1="32" y1="20" x2="128" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C8EFF"/>
      <stop offset="0.55" stop-color="#6B7DFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="epLensFillDark" cx="78" cy="50" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2444" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#121947" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#121947" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="epEuGradDark" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FB1FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <style>
      .ep-orbit-1 { transform-origin: 78px 60px; animation: ep-spin-cw 16s linear infinite; }
      .ep-orbit-2 { transform-origin: 78px 60px; animation: ep-spin-ccw 22s linear infinite; }
      .ep-orbit-3 { transform-origin: 78px 60px; animation: ep-spin-cw 28s linear infinite; }
      .ep-jewel { transform-origin: 78px 60px; animation: ep-pulse 3.4s ease-in-out infinite; }
      @keyframes ep-spin-cw { to { transform: rotate(360deg); } }
      @keyframes ep-spin-ccw { to { transform: rotate(-360deg); } }
      @keyframes ep-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ep-orbit-1, .ep-orbit-2, .ep-orbit-3, .ep-jewel { animation: none; }
      }
    </style>
  </defs>

  <g>
    <path d="M28 110 L52 86" stroke="url(#epLensGradDark)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="78" cy="60" r="36" fill="url(#epLensFillDark)" stroke="url(#epLensGradDark)" stroke-width="6"/>
    <circle cx="78" cy="60" r="18" stroke="#9FB1FF" stroke-width="2.2" fill="none" opacity="0.45"/>
    <g class="ep-jewel">
      <path d="M78 50 L82.5 60 L78 70 L73.5 60 Z" fill="#9FB1FF"/>
      <path d="M68 60 L78 56 L88 60 L78 64 Z" fill="#22D3EE"/>
      <circle cx="78" cy="60" r="2.4" fill="#FFFFFF"/>
    </g>
    <g class="ep-orbit-1">
      <circle cx="44" cy="30" r="5" fill="#22D3EE"/>
      <path d="M50 34 L60 42" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    </g>
    <g class="ep-orbit-2">
      <circle cx="118" cy="42" r="6" fill="#A78BFA"/>
      <path d="M112 46 L100 52" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    </g>
    <g class="ep-orbit-3">
      <circle cx="108" cy="100" r="5" fill="#F472B6"/>
      <path d="M104 95 L94 86" stroke="#F472B6" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>

  <text x="140" y="68" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#epEuGradDark)" letter-spacing="-1.5">eu</text>
  <text x="196" y="68" font-family="Sora, Inter, system-ui, sans-serif" font-size="44" font-weight="500" fill="#F5F8FF" letter-spacing="-0.8">procuro</text>
  <text x="140" y="100" font-family="Sora, Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#9FB1FF" letter-spacing="3.2">MARKETPLACE REVERSO</text>
</svg>
