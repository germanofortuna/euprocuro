spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/euprocuro}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

feign:
  client:
    config:
      viaCepClient:
        connectTimeout: ${APP_VIACEP_CONNECT_TIMEOUT_MS:2000}
        readTimeout: ${APP_VIACEP_READ_TIMEOUT_MS:3000}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

application:
  auth:
    session-hours: ${APP_AUTH_SESSION_HOURS:168}
    session-renewal-threshold-hours: ${APP_AUTH_SESSION_RENEWAL_THRESHOLD_HOURS:24}
    password-reset-hours: ${APP_AUTH_PASSWORD_RESET_HOURS:2}
    email-verification-hours: ${APP_AUTH_EMAIL_VERIFICATION_HOURS:24}
    email-verification-required: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:true}
    reset-base-url: ${APP_RESET_BASE_URL:http://localhost:5173}
    expose-reset-preview: ${APP_AUTH_EXPOSE_RESET_PREVIEW:false}
    expose-session-token: ${APP_AUTH_EXPOSE_SESSION_TOKEN:false}
    cookie:
      name: ${APP_AUTH_COOKIE_NAME:EU_PROCURO_SESSION}
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
  email:
    provider: ${APP_EMAIL_PROVIDER:SMTP}
    fail-open: ${APP_EMAIL_FAIL_OPEN:false}
    from: ${APP_EMAIL_FROM:no-reply@euprocuro.local}
    from-name: ${APP_EMAIL_FROM_NAME:Eu Procuro}
    app-url: ${APP_EMAIL_APP_URL:${APP_RESET_BASE_URL:http://localhost:5173}}
    terms-url: ${APP_EMAIL_TERMS_URL:${APP_EMAIL_APP_URL:http://localhost:5173}#termos-de-uso}
    privacy-url: ${APP_EMAIL_PRIVACY_URL:${APP_EMAIL_APP_URL:http://localhost:5173}#politica-de-privacidade}
    support-url: ${APP_EMAIL_SUPPORT_URL:mailto:suporte@euprocuro.com}
    mailersend:
      api-url: ${MAILERSEND_API_URL:https://api.mailersend.com/v1/email}
      api-key: ${MAILERSEND_API_KEY:}
      template-id:
        default: ${MAILERSEND_TEMPLATE_ID_DEFAULT:}
        email-verification: ${MAILERSEND_TEMPLATE_ID_EMAIL_VERIFICATION:}
        password-reset: ${MAILERSEND_TEMPLATE_ID_PASSWORD_RESET:}
        offer-received: ${MAILERSEND_TEMPLATE_ID_OFFER_RECEIVED:}
        conversation-message: ${MAILERSEND_TEMPLATE_ID_CONVERSATION_MESSAGE:}
        purchase-confirmation: ${MAILERSEND_TEMPLATE_ID_PURCHASE_CONFIRMATION:}
        boost-activated: ${MAILERSEND_TEMPLATE_ID_BOOST_ACTIVATED:}
  monetization:
    provider: ${APP_MONETIZATION_PROVIDER:MERCADO_PAGO_CHECKOUT_PRO}
    local-checkout:
      enabled: ${LOCAL_CHECKOUT_ENABLED:false}
      base-url: ${LOCAL_CHECKOUT_BASE_URL:http://localhost:8080/api/monetization/local-checkout/approve}
      success-url: ${LOCAL_CHECKOUT_SUCCESS_URL:http://localhost:5173?payment=success}
    mercado-pago:
      access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
      sandbox: ${MERCADO_PAGO_SANDBOX:true}
      success-url: ${MERCADO_PAGO_SUCCESS_URL:http://localhost:5173?payment=success}
      failure-url: ${MERCADO_PAGO_FAILURE_URL:http://localhost:5173?payment=failure}
      pending-url: ${MERCADO_PAGO_PENDING_URL:http://localhost:5173?payment=pending}
      notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
      webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
      webhook-signature-required: ${MERCADO_PAGO_WEBHOOK_SIGNATURE_REQUIRED:true}
      webhook-signature-max-age-seconds: ${MERCADO_PAGO_WEBHOOK_SIGNATURE_MAX_AGE_SECONDS:300}
  listings:
    expiration-days: ${APP_LISTING_EXPIRATION_DAYS:30}
    renewal-days: ${APP_LISTING_RENEWAL_DAYS:30}
    cleanup:
      enabled: ${APP_LISTING_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${APP_LISTING_CLEANUP_FIXED_DELAY_MS:3600000}
  cache:
    public:
      enabled: ${APP_PUBLIC_CACHE_ENABLED:true}
      max-entries: ${APP_PUBLIC_CACHE_MAX_ENTRIES:2000}
      content-ttl-seconds: ${APP_PUBLIC_CACHE_CONTENT_TTL_SECONDS:300}
      catalog-ttl-seconds: ${APP_PUBLIC_CACHE_CATALOG_TTL_SECONDS:300}
      marketplace-ttl-seconds: ${APP_PUBLIC_CACHE_MARKETPLACE_TTL_SECONDS:60}
      address-ttl-seconds: ${APP_PUBLIC_CACHE_ADDRESS_TTL_SECONDS:2592000}
  audit:
    ttl-seconds: ${APP_AUDIT_TTL_SECONDS:604800}
    external-log-ttl-seconds: ${APP_EXTERNAL_LOG_TTL_SECONDS:604800}
    external-log-body-max-length: ${APP_EXTERNAL_LOG_BODY_MAX_LENGTH:4000}
  hml:
    access:
      enabled: ${APP_HML_ACCESS_ENABLED:false}
      allowed-emails: ${APP_HML_ALLOWED_EMAILS:}
  admin:
    allowed-emails: ${APP_ADMIN_ALLOWED_EMAILS:gfortuna@outlook.com}
  moderation:
    local:
      blocked-terms: ${APP_MODERATION_BLOCKED_TERMS:assassino de aluguel,documento falso,cartao clonado,cartao de credito,senha,credencial,pornografia,putaria,puta}
    ai:
      review-threshold: ${APP_MODERATION_REVIEW_THRESHOLD:0.20}
      reject-threshold: ${APP_MODERATION_REJECT_THRESHOLD:0.30}
    openai:
      enabled: ${APP_OPENAI_MODERATION_ENABLED:true}
      api-key: ${OPENAI_API_KEY:}
      model: ${APP_OPENAI_MODERATION_MODEL:omni-moderation-latest}
      base-url: ${APP_OPENAI_BASE_URL:https://api.openai.com}
  messaging:
    rabbit:
      exchange: ${APP_RABBIT_EXCHANGE:euprocuro.exchange}
      interest-created-queue: ${APP_RABBIT_INTEREST_CREATED_QUEUE:euprocuro.interest.created}
      interest-moderation-queue: ${APP_RABBIT_INTEREST_MODERATION_QUEUE:euprocuro.interest.moderation}
      offer-created-queue: ${APP_RABBIT_OFFER_CREATED_QUEUE:euprocuro.offer.created}
      conversation-message-created-queue: ${APP_RABBIT_CONVERSATION_MESSAGE_CREATED_QUEUE:euprocuro.conversation.message.created}
      auth-queue: ${APP_RABBIT_AUTH_QUEUE:euprocuro.auth.events}
  security:
    document-hash-pepper: ${APP_SECURITY_DOCUMENT_HASH_PEPPER:}
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:300}
      max-requests: ${APP_RATE_LIMIT_MAX_REQUESTS:25}
      max-tracked-keys: ${APP_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
