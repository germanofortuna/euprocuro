spring:
  rabbitmq:
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

application:
  monetization:
    provider: ${APP_MONETIZATION_PROVIDER:MERCADO_PAGO_CHECKOUT_PRO}
  auth:
    expose-reset-preview: false
    expose-session-token: false
    cookie:
      secure: true
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}
  security:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://app.euprocuro.com,https://euprocuro.vercel.app}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
