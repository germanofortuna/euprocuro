spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/euprocuro

application:
  email:
    fail-open: ${APP_EMAIL_FAIL_OPEN:true}
  auth:
    email-verification-required: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:false}
    expose-reset-preview: ${APP_AUTH_EXPOSE_RESET_PREVIEW:true}
    phone-verification:
      provider: ${PHONE_VERIFICATION_PROVIDER:LOG}
      dev-bypass-code: ${PHONE_VERIFICATION_DEV_BYPASS_CODE:00000}
  admin:
    allowed-emails: ${APP_ADMIN_ALLOWED_EMAILS:gfortuna@outlook.com}
  monetization:
    provider: ${APP_MONETIZATION_PROVIDER:LOCAL_CHECKOUT_MOCK}
    local-checkout:
      enabled: ${LOCAL_CHECKOUT_ENABLED:true}
      base-url: ${LOCAL_CHECKOUT_BASE_URL:http://localhost:8080/api/monetization/local-checkout/approve}
      success-url: ${LOCAL_CHECKOUT_SUCCESS_URL:http://localhost:5173?payment=success}
