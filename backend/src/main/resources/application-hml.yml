spring:
  data:
    mongodb:
      uri: ${MONGO_ATLAS_HML_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:guest}

application:
  auth:
    expose-reset-preview: false
    expose-session-token: false
    cookie:
      secure: true
      same-site: None
  hml:
    access:
      enabled: ${APP_HML_ACCESS_ENABLED:true}
      allowed-emails: ${APP_HML_ALLOWED_EMAILS:}
