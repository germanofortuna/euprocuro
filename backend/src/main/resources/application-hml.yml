spring:
  data:
    mongodb:
      uri: ${MONGO_ATLAS_HML_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:guest}

application:
  security:
    default-allowed-origins: https://hml.euprocuro.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://hml.euprocuro.com}
  monetization:
    provider: ${APP_MONETIZATION_PROVIDER:MERCADO_PAGO_CHECKOUT_PRO}
    mercado-pago:
      sandbox: ${MERCADO_PAGO_SANDBOX:true}
  auth:
    expose-reset-preview: false
    expose-session-token: ${APP_AUTH_EXPOSE_SESSION_TOKEN:false}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:None}
  hml:
    access:
      enabled: ${APP_HML_ACCESS_ENABLED:true}
      allowed-emails: ${APP_HML_ALLOWED_EMAILS:}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
